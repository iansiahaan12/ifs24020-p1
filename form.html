<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pendaftaran Akun</title>
</head>
<body>

  <!--Untuk Navigasi-->
  <nav>
    <a href="index.html">IMDb Top 3 Movies</a> &nbsp;|&nbsp;
    <a href="blog.html">Dev Blogs</a> &nbsp;|&nbsp;
    <a href="form.html">Form Pendaftaran</a> &nbsp;|&nbsp;
    <a href="cv.html">CV</a>
  </nav>
  <hr>
  <main>
    <table width="600" align="center" border="0">
      <tr>
        <td>  
          <h1>Form Pendaftaran Akun</h1>
          <form action="" method="POST">
            <fieldset>
              <legend>Daftar Akun</legend>
              
              <!-- Menggunakan Explicit Label (Atribut for dan id) -->
              <label for="nama_lengkap">Nama Lengkap:</label> 
              <input type="text" id="nama_lengkap" name="nama_lengkap">
              <hr>
              
              Jenis Kelamin: 
              <!-- Menggunakan Implicit Label (Dibungkus) -->
              <label><input type="radio" name="jenis_kelamin" value="Laki-Laki"> Laki-Laki</label> 
              <label><input type="radio" name="jenis_kelamin" value="Perempuan"> Perempuan</label>
              <hr>
              
              <label for="tempat_lahir">Tempat Lahir:</label> 
              <input type="text" id="tempat_lahir" name="tempat_lahir">
              <hr>
              
              <label for="tanggal_lahir">Tanggal Lahir:</label> 
              <input type="date" id="tanggal_lahir" name="tanggal_lahir">
              <hr>
              
              <label for="agama">Agama:</label> 
              <select id="agama" name="agama">
                <option value="">--- Pilih Agama ---</option>
                <option value="Islam">Islam</option>
                <option value="Katolik">Katolik</option>
                <option value="Protestan">Protestan</option>
                <option value="Hindu">Hindu</option>
                <option value="Buddha">Buddha</option>
                <option value="Konghucu">Konghucu</option>
              </select>
              <hr>
              
              Hobi: 
              <label><input type="checkbox" name="hobi" value="Olahraga"> Olahraga</label> 
              <label><input type="checkbox" name="hobi" value="Membaca"> Membaca</label> 
              <label><input type="checkbox" name="hobi" value="Ngoding"> Ngoding</label>
              <hr>
              
              <label for="password">Password:</label> 
              <input type="password" id="password" name="password">
              <hr>
              
              <label>
                <input type="checkbox" name="persetujuan"> Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.
              </label>
              <hr>
              
              <input type="reset" value="Reset">
              <input type="submit" value="Submit">
            </fieldset>
          </form>
        </td>
      </tr>
    </table>
  </main>
 </body>
</html>
